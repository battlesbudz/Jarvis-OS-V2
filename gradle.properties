# Bound concurrent workers and give the Kotlin compiler its own heap.
# The compiler previously inherited Gradle's 2 GiB heap on cold hosted builds.
# Kotlin's coroutine analysis needs an 8 MiB stack in the daemon and in-process fallback.
org.gradle.jvmargs=-Xmx2048m -Xss8m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx4096m -Xss8m
kotlin.build.report.output=file
android.useAndroidX=true
kotlin.code.style=official
