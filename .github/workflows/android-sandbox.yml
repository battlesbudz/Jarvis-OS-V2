name: Android sandbox

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  profiles:
    name: Resolve required device profiles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: python3 scripts/verification/profiles.py matrix --github-output "$GITHUB_OUTPUT"

  verify:
    name: Release journeys / ${{ matrix.id }} / ${{ matrix.apk }}
    needs: profiles
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profiles.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native ARM64 software-emulation host
        if: matrix.acceleration == 'software'
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Set up Java for the ARM64 Android SDK
        if: matrix.acceleration == 'software'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64
      - name: Set up Python for the ARM64 verification controller
        if: matrix.acceleration == 'software'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up the ARM64 Android SDK
        if: matrix.acceleration == 'software'
        uses: android-actions/setup-android@v3
        with:
          # setup-android v3 defaults to the retired "tools" package. Native ARM64
          # hosts need current adb only here; the profile step installs emulator/images.
          packages: platform-tools
      - name: Resolve exact build artifact IDs
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/verification/artifacts.py fetch --out artifact-manifest.json --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          python3 scripts/verification/artifacts.py select --manifest artifact-manifest.json --run-id "$GITHUB_RUN_ID" --head-sha "$EXPECTED_HEAD" --require 'jarvis-os-v2-release-apk=Build signed release APK' --require 'jarvis-verification-test-apk=Build signed release APK' --require 'jarvis-previous-release=Prepare upgrade baseline' --require-success --github-output "$GITHUB_OUTPUT"
      - name: Download exact build inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verification/artifacts.py download --manifest artifact-manifest.json --artifact-ids "${{ steps.artifacts.outputs.artifact_ids }}" --out inputs --layout named
      - name: Enable emulator acceleration
        if: matrix.acceleration == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-jarvis-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record available Android hardware profiles
        run: avdmanager list device
      - name: Verify release on a disposable Android device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.device_profile }}
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: ${{ matrix.boot_timeout }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot ${{ matrix.acceleration == 'software' && '-accel off' || '' }}
          script: python3 scripts/verification/android.py run --profile "${{ matrix.id }}" --apk inputs/jarvis-os-v2-release-apk/${{ matrix.apk }}.apk --test-apk inputs/jarvis-verification-test-apk/app-release-androidTest.apk --previous-apk inputs/jarvis-previous-release/app-release.apk --previous-metadata inputs/jarvis-previous-release/previous-release.json --out verification-evidence --source-commit "${{ github.sha }}" --pr-head "${{ github.event.pull_request.head.sha }}" --allow-emulator-reset
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-verification-${{ matrix.id }}-${{ matrix.apk }}
          path: verification-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Add verification summary
        if: always()
        run: |
          if [ -f verification-evidence/summary.md ]; then
            cat verification-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'FAIL: emulator infrastructure did not produce a verification report.' >> "$GITHUB_STEP_SUMMARY"
          fi
