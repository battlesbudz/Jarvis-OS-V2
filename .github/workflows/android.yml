name: Android APK

on:
  pull_request:
  push:
    # Feature branches build/test without opening a PR or publishing a release.
    # PR runs separately verify GitHub's combined merge candidate.
    branches: [main, PR1, feature-tools, 'feature/**']

permissions:
  contents: read
  actions: read

jobs:
  build-release:
    name: Build signed release APK
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/PR1' ||
        github.ref == 'refs/heads/feature-tools' ||
        startsWith(github.ref, 'refs/heads/feature/'))) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'  # LiteRT 0.16 SDK host tests load Java 21 class files.

      - name: Install speech runtime NDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"'

      - name: Cache shared speech runtime
        uses: actions/cache@v4
        with:
          path: app/build/sherpa-native
          key: sherpa-arm64-137-${{ runner.os }}-${{ hashFiles('scripts/build_sherpa.py', 'scripts/sherpa_jni_profile.py') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify interruption keyword models in native engine
        run: |
          cmake -S app/src/main/cpp/microwakeword -B /tmp/keyword-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/keyword-native --parallel 2
          python3 scripts/check_keyword_models.py /tmp/keyword-native/microwakeword_test

      - name: Verify native dependency helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.keystore"

      - name: Run release tests and assemble APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ format('{0}/jarvis-release.keystore', runner.temp) }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 0.1.0-build.${{ github.run_number }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease assembleReleaseAndroidTest

      - name: Upload release instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-verification-test-apk
          path: app/build/outputs/apk/androidTest/release/*.apk
          if-no-files-found: error

      - name: Retain JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-unit-tests
          path: |
            app/build/test-results/testReleaseUnitTest/
            app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: warn

      - name: Report APK size against build 705
        run: |
          python3 scripts/apk_size_report.py app/build/outputs/apk/release/app-release.apk --output artifact/size --baseline docs/measurements/build-705-apk-size.json
          cat artifact/size/apk-size.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK size report
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-v2-apk-size
          path: artifact/size/
          if-no-files-found: error

      - name: Verify ASR native packaging
        run: python3 scripts/check_asr_apk.py app/build/outputs/apk/release/app-release.apk

      - name: Verify Piper callback ABI and retired assets in APK
        run: python3 scripts/check_tts_callback.py app/build/outputs/apk/release/app-release.apk

      - name: Verify signed release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_BUILD_TOOLS="${ANDROID_HOME}/build-tools"
          APKSIGNER="$(find "$SDK_BUILD_TOOLS" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload release shrinker reports
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-v2-release-r8-reports
          path: app/build/outputs/mapping/release/
          if-no-files-found: error

      - name: Stage release APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/app-release.apk

      - name: Build and verify compact APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ format('{0}/jarvis-release.keystore', runner.temp) }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 0.1.0-build.${{ github.run_number }}
        run: |
          gradle --no-daemon -PcompactApk=true assembleRelease
          cp app/build/outputs/apk/release/app-release.apk artifact/app-compact.apk
          python3 scripts/check_compact_apk.py artifact/app-release.apk artifact/app-compact.apk
          python3 scripts/check_asr_apk.py artifact/app-compact.apk
          python3 scripts/check_tts_callback.py artifact/app-compact.apk
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose artifact/app-compact.apk
          python3 scripts/apk_size_report.py artifact/app-compact.apk --output artifact/compact-size --baseline docs/measurements/build-705-apk-size.json
          cat artifact/compact-size/apk-size.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compact APK size report
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-v2-compact-apk-size
          path: artifact/compact-size/
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-v2-release-apk
          path: artifact/*.apk
          if-no-files-found: error

  verify-release:
    name: Verify signed release in Android sandbox
    needs: build-release
    uses: ./.github/workflows/android-sandbox.yml

  verification-receipt:
    name: Consolidate exact-build verification evidence
    if: always() && needs.build-release.result != 'skipped'
    needs: [build-release, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact same-run evidence IDs
        id: evidence
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/verification/artifacts.py fetch --out artifact-manifest.json --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          python3 scripts/verification/artifacts.py select --manifest artifact-manifest.json --run-id "$GITHUB_RUN_ID" --head-sha "$EXPECTED_HEAD" --require 'jarvis-release-unit-tests=Build signed release APK' --require 'jarvis-verification-test-apk=Build signed release APK' --require 'jarvis-os-v2-release-apk=Build signed release APK' --require 'jarvis-verification-api-30-app-release=Verify signed release in Android sandbox / Release journeys / API 30 / app-release' --require 'jarvis-verification-api-35-app-compact=Verify signed release in Android sandbox / Release journeys / API 35 / app-compact' --github-output "$GITHUB_OUTPUT"
      - name: Download exact same-run evidence
        if: steps.evidence.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verification/artifacts.py download --manifest artifact-manifest.json --artifact-ids "${{ steps.evidence.outputs.artifact_ids }}" --out verification-inputs --layout named
      - name: Verify artifact bytes and test evidence
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/verification/receipt.py --inputs verification-inputs --out verification-receipt
      - name: Retain verification receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-verification-receipt
          path: verification-receipt/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish signed release APK
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [build-release, verify-release, verification-receipt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact release APK ID
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/verification/artifacts.py fetch --out artifact-manifest.json --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          python3 scripts/verification/artifacts.py select --manifest artifact-manifest.json --run-id "$GITHUB_RUN_ID" --head-sha "$EXPECTED_HEAD" --require 'jarvis-os-v2-release-apk=Build signed release APK' --require-success --github-output "$GITHUB_OUTPUT"
      - name: Download exact release APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verification/artifacts.py download --manifest artifact-manifest.json --artifact-ids "${{ steps.artifacts.outputs.artifact_ids }}" --out dist --layout flat

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'pull_request' && format('audio-pr2-pr{0}-build.{1}', github.event.pull_request.number, github.run_number) || format('v0.1.0-build.{0}', github.run_number) }}
          target_commitish: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          name: Jarvis OS V2 ${{ github.event_name == 'pull_request' && 'Audio PR2' || 'test' }} build ${{ github.run_number }}
          generate_release_notes: true
          files: dist/*.apk

  publish-pr-test:
    name: Publish permanent PR test APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/PR1'
    needs: [build-release, verify-release, verification-receipt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact release APK ID
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/verification/artifacts.py fetch --out artifact-manifest.json --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          python3 scripts/verification/artifacts.py select --manifest artifact-manifest.json --run-id "$GITHUB_RUN_ID" --head-sha "$EXPECTED_HEAD" --require 'jarvis-os-v2-release-apk=Build signed release APK' --require-success --github-output "$GITHUB_OUTPUT"
      - name: Download exact release APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verification/artifacts.py download --manifest artifact-manifest.json --artifact-ids "${{ steps.artifacts.outputs.artifact_ids }}" --out dist --layout flat

      - name: Publish permanent PR test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pr1-test
          target_commitish: ${{ github.sha }}
          name: Jarvis OS V2 PR1 test build
          prerelease: true
          generate_release_notes: false
          files: dist/*.apk
