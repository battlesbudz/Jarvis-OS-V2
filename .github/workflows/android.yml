name: Android APK

on:
  pull_request:
  push:
    # Open PRs already build, test, and publish their signed APK.
    branches: [main, PR1]

permissions:
  contents: read

jobs:
  build-pr:
    name: Build and test PR APK
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/PR1')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install speech runtime NDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"'

      - name: Cache patched speech runtime
        uses: actions/cache@v4
        with:
          path: app/build/sherpa-native
          key: sherpa-arm64-137-${{ runner.os }}-${{ hashFiles('scripts/build_sherpa.py', 'native/sherpa/pocket-streaming.patch') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify interruption keyword models in native engine
        run: |
          cmake -S app/src/main/cpp/microwakeword -B /tmp/keyword-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/keyword-native --parallel 2
          python3 scripts/check_keyword_models.py /tmp/keyword-native/microwakeword_test

      - name: Run unit tests and assemble APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify ASR native packaging
        run: |
          python3 -m unittest discover -s scripts -p 'test_native_dependencies.py'
          python3 scripts/check_asr_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify Pocket callback ABI in APK
        run: python3 scripts/check_tts_callback.py app/build/outputs/apk/debug/app-debug.apk

      - name: Stage debug APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-v2-debug-apk
          path: artifact/app-debug.apk
          if-no-files-found: error

  build-release:
    name: Build signed release APK
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install speech runtime NDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"'

      - name: Cache patched speech runtime
        uses: actions/cache@v4
        with:
          path: app/build/sherpa-native
          key: sherpa-arm64-137-${{ runner.os }}-${{ hashFiles('scripts/build_sherpa.py', 'native/sherpa/pocket-streaming.patch') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.keystore"

      - name: Run release tests and assemble APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ format('{0}/jarvis-release.keystore', runner.temp) }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 0.1.0-build.${{ github.run_number }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify ASR native packaging
        run: python3 scripts/check_asr_apk.py app/build/outputs/apk/release/app-release.apk

      - name: Verify Pocket callback ABI in APK
        run: python3 scripts/check_tts_callback.py app/build/outputs/apk/release/app-release.apk

      - name: Verify signed release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_BUILD_TOOLS="${ANDROID_HOME}/build-tools"
          APKSIGNER="$(find "$SDK_BUILD_TOOLS" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload release shrinker reports
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-v2-release-r8-reports
          path: app/build/outputs/mapping/release/
          if-no-files-found: error

      - name: Stage release APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/app-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-v2-release-apk
          path: artifact/app-release.apk
          if-no-files-found: error

  publish:
    name: Publish signed release APK
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: jarvis-os-v2-release-apk
          path: dist

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'pull_request' && format('audio-pr2-pr{0}-build.{1}', github.event.pull_request.number, github.run_number) || format('v0.1.0-build.{0}', github.run_number) }}
          target_commitish: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          name: Jarvis OS V2 ${{ github.event_name == 'pull_request' && 'Audio PR2' || 'test' }} build ${{ github.run_number }}
          generate_release_notes: true
          files: dist/app-release.apk

  publish-pr-test:
    name: Publish permanent PR test APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/PR1'
    needs: build-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: jarvis-os-v2-debug-apk
          path: dist

      - name: Publish permanent PR test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pr1-test
          target_commitish: ${{ github.sha }}
          name: Jarvis OS V2 PR1 test build
          prerelease: true
          generate_release_notes: false
          files: dist/app-debug.apk
