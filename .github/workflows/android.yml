name: Android APK

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-pr:
    name: Build and test PR APK
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests and assemble APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Stage debug APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-v2-debug-apk
          path: artifact/app-debug.apk
          if-no-files-found: error

  build-release:
    name: Build signed release APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.keystore"

      - name: Run release tests and assemble APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ format('{0}/jarvis-release.keystore', runner.temp) }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Stage release APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/app-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-v2-release-apk
          path: artifact/app-release.apk
          if-no-files-found: error

  publish:
    name: Publish signed release APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: jarvis-os-v2-release-apk
          path: dist

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build.${{ github.run_number }}
          name: Jarvis OS V2 test build ${{ github.run_number }}
          generate_release_notes: true
          files: dist/app-release.apk
