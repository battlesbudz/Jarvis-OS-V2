name: Delete approved CI branches
on:
  push:
    branches: [feature-tools]
    paths: ['.github/workflows/delete-approved-ci-branches.yml']
permissions:
  contents: write
jobs:
  delete-approved:
    if: github.repository == 'battlesbudz/Jarvis-OS-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify ancestry and delete only approved CI branches
        shell: python
        run: |
          import os, json, subprocess
          assert os.environ["GITHUB_REPOSITORY"] == "battlesbudz/Jarvis-OS-V2"
          assert os.environ["GITHUB_REF"] == "refs/heads/feature-tools"
          expected = {"feature/ci-retry-evidence":"5643517b54d10a01f8d9f71631ee2e0ae81f371f","feature/ci-sandbox-proof":"c20b5137d010aa2a99814bea4387201b485182c7"}
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          def refs():
              return {line.split()[1].removeprefix("refs/heads/"): line.split()[0] for line in git("ls-remote", "--heads", "origin").splitlines()}
          before = refs()
          for branch, sha in expected.items():
              assert before.get(branch) == sha, "Branch moved: " + branch
              for target in ["audio-pr2", "feature/memory-os-v2", "feature-tools"]:
                  subprocess.run(["git", "merge-base", "--is-ancestor", sha, "origin/" + target], check=True)
          leases = ["--force-with-lease=refs/heads/" + b + ":" + sha for b, sha in expected.items()]
          deletions = [":refs/heads/" + b for b in expected]
          subprocess.run(["git", "push", "--dry-run", "--atomic", *leases, "origin", *deletions], check=True)
          subprocess.run(["git", "push", "--atomic", *leases, "origin", *deletions], check=True)
          after = refs()
          assert after == {b: sha for b, sha in before.items() if b not in expected}
          print(json.dumps({"deleted": expected, "remaining": after}, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("Deleted only feature/ci-retry-evidence and feature/ci-sandbox-proof after verifying both tips are ancestors of all three working branches. All remaining branch refs unchanged.\n")
          
